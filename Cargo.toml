[package]
name = "gdship"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Export a Godot 4 project and push each build to itch.io with butler"
license = "MIT"
repository = "https://github.com/DevPrice/gdship"
readme = "README.md"
keywords = ["godot", "itch", "butler", "gamedev", "deploy"]
categories = ["command-line-utilities", "game-development", "development-tools"]
include = ["/src", "/README.md", "/LICENSE", "/Cargo.lock"]

[workspace]
members = ["tests/fake-tool"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tiny_http = "0.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unreachable_pub = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
